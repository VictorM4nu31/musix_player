name: musix_player
description: "Musix Player - A modern local MP3 music player for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Persistence
  shared_preferences: ^2.3.4

  # Device access & permissions
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0

  # Audio playback
  just_audio: ^0.9.42
  audio_service: ^0.18.17

  # Android home screen widget
  home_widget: ^0.7.0

  # Paths for widget artwork cache
  path_provider: ^2.1.5
  just_waveform: ^0.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true



  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 400
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 600
        - asset: assets/fonts/Orbitron-Regular.ttf
          weight: 700
