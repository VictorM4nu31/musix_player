name: musix_player
description: "Musix Player - A modern local MP3 music player for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Persistence
  shared_preferences: ^2.3.4

  # Google Fonts
  google_fonts: ^6.2.1

  # Device access & permissions
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0

  # Audio playback
  just_audio: ^0.9.42
  audio_service: ^0.18.17

  # Android home screen widget
  home_widget: ^0.7.0

  # Paths for widget artwork cache
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
